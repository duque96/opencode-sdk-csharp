name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout repository
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.sha }}

      - name: Setup .NET SDK
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify release readiness
        if: ${{ steps.release.outputs.release_created }}
        run: bash eng/verify-release.sh Release

      - name: Publish NuGet package
        if: ${{ steps.release.outputs.release_created }}
        run: |
          mapfile -t packages < <(find artifacts/package/release -maxdepth 1 -type f -name 'Opencode.Sdk.*.nupkg' ! -name '*.snupkg' | sort)

          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "No NuGet packages found under artifacts/package/release." >&2
            exit 1
          fi

          dotnet nuget push "${packages[@]}" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}