name: Publish NuGet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify release readiness
        run: bash eng/verify-release.sh Release

      - name: Publish NuGet package
        run: |
          mapfile -t packages < <(find artifacts/package/release -maxdepth 1 -type f -name 'Opencode.Sdk.*.nupkg' ! -name '*.snupkg' | sort)

          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "No NuGet packages found under artifacts/package/release." >&2
            exit 1
          fi

          dotnet nuget push "${packages[@]}" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}